name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck

      - name: Lint
        run: make lint

      # The whole suite runs against a mocked lxc: no LXD, no container, no root.
      - name: Test
        run: make test
